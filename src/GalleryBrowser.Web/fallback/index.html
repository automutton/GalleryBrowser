<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GalleryBrowser</title>
    <style>
      :root {
        color: #f4f6fb;
        background: #111318;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(34, 197, 94, 0.10), transparent 30%),
          linear-gradient(315deg, rgba(14, 165, 233, 0.12), transparent 34%),
          #111318;
      }

      main {
        width: min(680px, calc(100vw - 48px));
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 8px;
        padding: 28px;
        background: rgba(255, 255, 255, 0.07);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.6rem;
      }

      p {
        margin: 0;
        color: #aeb8c8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GalleryBrowser</h1>
      <p>
        The WPF WebView2 host is running. Build the Svelte UI with
        <code>npm install</code> and <code>npm run build</code> in
        <code>src/GalleryBrowser.Web</code>.
      </p>
    </main>
    <script>
      window.chrome?.webview?.postMessage({ type: 'app.ready' });
    </script>
  </body>
</html>
